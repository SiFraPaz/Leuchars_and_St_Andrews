<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Leuchars and St Andrews</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.
html, body, #map {
    height: 100%;
    margin: 0;
    padding: 0;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg1.9.4/dist/leaflet.jsscript>

<script>

var map = L.map('map').setView([56.34, -2.80], 10);

L.tileLayer('./{z}/{x}/{y}.png', {
    minZoom: 6,
    maxZoom: 16,
    noWrap: true
}).addTo(map);

</script>

</body>
</html>
