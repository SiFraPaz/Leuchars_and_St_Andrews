<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Leuchars and St Andrews</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const bounds = [[56.24, -3.24], [56.49, -2.46]];

const map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
}).setView([56.34, -2.80], 10);

L.tileLayer('./{z}/{x}/{y}.png', {
    minZoom: 6,
    maxZoom: 16,
    bounds: bounds,
    noWrap: true
}).addTo(map);
</script>
  
</body>
</html>
