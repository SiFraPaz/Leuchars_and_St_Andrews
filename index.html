<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Leuchars and St Andrews</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.   html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script/unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

var map = L.map('map').setView([56.34, -2.80], 10);

L.tileLayer('./{z}/{x}/{y}.png', {
    minZoom: 6,
    maxZoom: 16,
    noWrap: true,
    attribution: 'QGIS QTiles'
}).addTo(map);

</script>

</body>
